    <div class="busy__loader" aria-hidden="true"><div class="busy-progress"></div></div>
    <div class="app-layout">
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle menu">
            <svg class="icon" width="24" height="24" aria-hidden="true"><use href="#i-menu"></use></svg>
        </button>
        <div class="app-sidebar-overlay" id="sidebar-overlay"></div>
        <nav class="app-sidebar" id="app-sidebar">
            <div class="sidebar-brand">
                <a href="/" data-app-nav>polka</a>
                <div id="sidebar-upload" class="sidebar-brand-upload" hidden>
                    <input type="file" id="book-upload-input" class="book-upload-input" accept="{{.BookUploadAccept}}" multiple hidden>
                    <button id="book-upload-btn" class="sidebar-icon-btn sidebar-upload-btn" type="button" aria-label="Add books" title="Add books">
                        <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-upload"></use></svg>
                    </button>
                </div>
            </div>
            <ul class="sidebar-nav sidebar-primary-nav">
                <li class="library-nav-row" id="library-nav-row">
                    <a href="/" id="nav-library" class="nav-item" data-app-nav>Library</a>
                    <button id="nav-library-actions" class="sidebar-icon-btn library-actions-btn" type="button" aria-label="Manage library" title="Manage library" hidden>
                        <svg class="icon" width="18" height="18" aria-hidden="true"><use href="#i-more_vert"></use></svg>
                    </button>
                </li>
                <li><a href="/series" id="nav-series" class="nav-item" data-app-nav>Series</a></li>
                <li><a href="/authors" id="nav-authors" class="nav-item" data-app-nav>Authors</a></li>
            </ul>
            <div class="sidebar-section sidebar-shelves-section">
                <div class="sidebar-section-header">
                    <span>Shelves</span>
                    <button id="new-shelf-btn" class="sidebar-icon-btn" type="button" aria-label="New shelf" title="New shelf">
                        <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-add"></use></svg>
                    </button>
                </div>
                <ul id="shelf-nav" class="sidebar-nav sidebar-shelves"></ul>
            </div>
            <div id="sidebar-account" class="sidebar-account" hidden></div>
        </nav>
        <main class="app-main">
            <div id="app-content" class="app-content">
            {{block "content" .}}{{end}}
            </div>
        </main>
    </div>
    {{block "bootstrap" .}}{{end}}
    <script src="/static/app.js"></script>
</body>
</html>
{{end}}
